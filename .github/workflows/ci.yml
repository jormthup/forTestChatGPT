name: POS checks
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: node --check app.js && node --check server.js && node --check data.js && node --check media.js
      - run: git diff --check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
